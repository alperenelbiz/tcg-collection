name: TCGCollection
options:
  bundleIdPrefix: com.alperenelbiz
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
# The signing team comes from the gitignored Config/Local.xcconfig.
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  TCGCollection:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [TCGCollection]
    settings:
      base:
        PRODUCT_NAME: TCGCollection2
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        # The Mac build reads the iCloud Drive folder the user picks; no sandbox keeps that one grant simple.
        ENABLE_APP_SANDBOX: NO
        DEVELOPMENT_LANGUAGE: en
        SWIFT_OBJC_BRIDGING_HEADER: TCGCollection/Prices/libarchive-shim.h
        # The app's accent (Theme.accent, #F2B33D) for what SwiftUI's tint does not reach on the Mac: the sidebar's
        # selected row and the system's own selection colours. A system accent other than Multicolor still wins.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # The app icon: TCGCollection/AppIcon.icon, an Icon Composer file (three fanned cards, the front one amber;
        # one file for the Mac and the iPhone; the system draws its glass and its dark and clear modes).
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        OTHER_LDFLAGS: -larchive
      # The Debug build is another app to macOS: XCUITest and a Debug run never touch the installed app,
      # its preferences or its window state. Release is the app that scripts/install-mac.sh installs.
      # Phase 7 (A69): the shown name is "TCG Collection" in both; the bundle ids and PRODUCT_NAME are unchanged.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.alperenelbiz.tcgcollection2.debug
          INFOPLIST_KEY_CFBundleDisplayName: TCG Collection (Debug)
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.alperenelbiz.tcgcollection2
          INFOPLIST_KEY_CFBundleDisplayName: TCG Collection
  TCGCollectionTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - TCGCollectionTests
      - path: TCGCollectionTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: TCGCollection
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alperenelbiz.tcgcollection2.tests
        # XcodeGen sets the iOS app layout; a Mac app keeps its binary in Contents/MacOS.
        "TEST_HOST[sdk=macosx*]": $(BUILT_PRODUCTS_DIR)/TCGCollection2.app/Contents/MacOS/TCGCollection2
  # Mac UI tests: they click the Debug app, which runs on a temporary store and the fixture network.
  TCGCollectionUITests:
    type: bundle.ui-testing
    supportedDestinations: [macOS]
    sources:
      - TCGCollectionUITests
      # The unit test fixtures, shared: the app under test reads them through `-fixtures`.
      - path: TCGCollectionTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: TCGCollection
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alperenelbiz.tcgcollection2.uitests
  # iPhone UI tests: they run the Debug app in the iOS Simulator, on a temporary store and the fixture network. They take
  # no pointer and need no "Enable UI Automation" approval on the Mac.
  TCGCollectionPhoneUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - TCGCollectionPhoneUITests
      # The unit test fixtures, shared: the app under test reads them through `-fixtures`.
      - path: TCGCollectionTests/Fixtures
        type: folder
        buildPhase: resources
    dependencies:
      - target: TCGCollection
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alperenelbiz.tcgcollection2.phoneuitests
        TARGETED_DEVICE_FAMILY: "1"
schemes:
  TCGCollection:
    build:
      targets:
        TCGCollection: all
        TCGCollectionTests: [test]
    test:
      targets: [TCGCollectionTests]
  # Only the UI tests: they take the pointer, so the unit scheme never runs them.
  TCGCollectionUI:
    build:
      targets:
        TCGCollection: all
        TCGCollectionUITests: [test]
    test:
      targets: [TCGCollectionUITests]
  # Only the iPhone UI tests, in the iOS Simulator: scripts/ui-test-phone.sh.
  TCGCollectionPhoneUI:
    build:
      targets:
        TCGCollection: all
        TCGCollectionPhoneUITests: [test]
    test:
      targets: [TCGCollectionPhoneUITests]
